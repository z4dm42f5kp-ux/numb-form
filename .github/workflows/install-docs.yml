name: install-docs

# The install commands in the documentation install one stable release
# and carry its SHA-256 checksums (scripts/install/pins.txt). After every
# stable release, and daily in case a run was missed, this checks the
# newest release's Sigstore signature, pins it and proposes the new
# commands as a pull request. Rolling builds are never pinned.

on:
  schedule:
    - cron: "37 6 * * *"
  push:
    branches: [main]
    paths:
      - scripts/install/**
      - internal/installdoc/**
  workflow_dispatch: # release.yml starts it after each stable release

permissions: {}

concurrency:
  group: install-docs
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the update branch
      pull-requests: write # open the pull request
      issues: write        # or an issue, when pull requests by workflows are off
      actions: write       # run ci on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Compare the pins with the newest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "unexpected tag $tag"; exit 1; }
          pinned=$(sed -n 's/^version //p' scripts/install/pins.txt)
          echo "newest stable release: $tag, pinned: $pinned"
          if [ "$tag" = "$pinned" ]; then
            echo "The install commands are current."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.release.outputs.tag != ''
      - name: Verify the release and pin it
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          d=$(mktemp -d)
          gh release download "$TAG" --repo "$REPO" --dir "$d" \
            --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json --pattern numb-form_linux_amd64.tar.gz
          # Only checksums signed by this repository's release workflow
          # for exactly this tag are pinned.
          cosign verify-blob --bundle "$d/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$d/SHA256SUMS"
          (cd "$d" && grep ' numb-form_linux_amd64.tar.gz$' SHA256SUMS | sha256sum -c -)
          programs=$(tar -tzf "$d/numb-form_linux_amd64.tar.gz" | grep -E '^numb-[a-z]+$' | tr '\n' ' ')
          # shellcheck disable=SC2086 # one argument per program
          go run ./scripts/install pin "$TAG" "$d/SHA256SUMS" $programs
          go run ./scripts/install render
          rm -rf "$d"
      - name: Propose the new install commands
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          branch="updates/install-$TAG"
          title="docs: install commands for $TAG"
          git checkout -b "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -a -m "$title" -m "Pinned from the release's SHA256SUMS after checking its Sigstore signature."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"
          body="The install commands in docs/install.md, docs/guide.md and docs/containers.md now install $TAG, with its SHA-256 checksums. They were taken from the release's SHA256SUMS after its Sigstore signature was checked against release.yml for $TAG. Merging this releases nothing."
          if [ -z "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            if ! gh pr create --repo "$REPO" --head "$branch" --base main --title "$title" --body "$body"; then
              # Settings > Actions > General can forbid pull requests by workflows.
              gh issue create --repo "$REPO" --title "$title" \
                --body "$body The branch $branch is ready; open a pull request from it (workflows may not open pull requests in this repository)."
            fi
          fi
          # A push with the workflow token starts no workflow.
          gh workflow run ci.yml --repo "$REPO" --ref "$branch"
