name: security

on:
  push:
    # main, and agent branches (tested on GitHub, never locally: #8)
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly: new vulnerabilities, longer fuzzing
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install govulncheck (verified by the Go checksum database)
        run: GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck (source, all platforms)
        run: |
          for os in linux windows darwin freebsd openbsd netbsd; do
            echo "== GOOS=$os"
            GOOS=$os "$RUNNER_TEMP/bin/govulncheck" ./...
          done
      - name: govulncheck (built binaries, all platforms)
        run: |
          for os in linux windows darwin freebsd openbsd netbsd; do
            GOOS=$os go build -trimpath -o "$RUNNER_TEMP/numb-form-$os" ./cmd/numb-form
            "$RUNNER_TEMP/bin/govulncheck" -mode=binary "$RUNNER_TEMP/numb-form-$os"
          done

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install gosec (verified by the Go checksum database)
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - name: gosec
        run: |
          "$RUNNER_TEMP/bin/gosec" -no-fail -fmt sarif -out gosec.sarif ./...
          "$RUNNER_TEMP/bin/gosec" -no-fail -fmt json -out gosec.json -severity medium -confidence medium ./...
          jq -r '.Issues[]? | "::error file=\(.file | sub("^.*/numb-form/numb-form/"; "")),line=\(.line),title=gosec \(.rule_id)::\(.details) (\(.severity)/\(.confidence))"' gosec.json
          test "$(jq '.Issues | length' gosec.json)" -eq 0
      - name: Upload gosec results
        # Pull requests (including Dependabot's) have a read-only token.
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: gosec.sarif
          category: gosec

  codeql:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, build-mode: manual }
          - { language: actions, build-mode: none }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          build-mode: ${{ matrix.build-mode }}
      - name: Build
        if: matrix.language == 'go'
        run: go build ./...
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: codeql-${{ matrix.language }}

  fuzz:
    # Every parser of untrusted input, including the legacy .xls reader,
    # is fuzzed on main (2 minutes each) and nightly (10 minutes each).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/docx, name: FuzzFill }
          - { pkg: ./internal/form, name: FuzzAllFormats }
          - { pkg: ./internal/odt, name: FuzzScan }
          - { pkg: ./internal/rtf, name: FuzzScan }
          - { pkg: ./internal/sheet, name: FuzzRead }
          - { pkg: ./internal/sheet, name: FuzzReadXLSX }
          - { pkg: ./internal/config, name: FuzzApply }
          - { pkg: ./internal/textutil, name: FuzzMatchKeys }
          - { pkg: ./internal/app, name: FuzzReadRequest }
          - { pkg: ./internal/match, name: FuzzFixPlaces }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Fuzz
        env:
          PKG: ${{ matrix.target.pkg }}
          NAME: ${{ matrix.target.name }}
          EVENT: ${{ github.event_name }}
        run: |
          t=2m
          [ "$EVENT" = schedule ] && t=10m
          go test "$PKG" -run '^$' -fuzz "^${NAME}\$" -fuzztime "$t"

  workflows:
    # zizmor audits the workflows themselves (template injection,
    # credential persistence, unpinned actions, excessive permissions).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install zizmor (hash-pinned)
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r .github/zizmor-requirements.txt
      - name: zizmor
        run: zizmor --offline --persona=pedantic --min-severity=medium .github/workflows

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No customer files or credentials in the repository
        run: |
          bad=$(git log --all --name-only --format= | grep -Ei '\.(docx|xlsx|xlsm|numbers|pages|pfx|p12|pem|key)$' | sort -u || true)
          if [ -n "$bad" ]; then echo "Forbidden files in history:"; echo "$bad"; exit 1; fi
          if git grep -nIE '(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_\-]{16,}' -- ':!*.md' ':!.github/*requirements.txt'; then
            echo "Possible hard-coded secret"; exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
