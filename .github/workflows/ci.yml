name: ci

# Pull requests get a fast gate (lint and tests on Linux, macOS and
# Windows). The slow jobs (BSD virtual machines, containers, every
# cross-compile target) run on main and nightly. A "changes" job skips Go
# work for documentation-only changes; skipped jobs count as passed, so
# required checks never hang.

on:
  push:
    # main, and agent branches (tested on GitHub, never locally: #8)
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
          pull_request) base=$PR_BASE ;;
          push) base=$PUSH_BEFORE ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation-only change: Go jobs skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  changes-listed:
    # A pull request that changes the programs lists the change in
    # CHANGES.md (.github/DOCUMENTATION.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: CHANGES.md lists the change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-changes.sh "$BASE" "$HEAD"

  pgp-sign:
    # The optional PGP signature of releases (scripts/pgp-sign.sh), tried
    # with a throwaway key made for this run.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Without a key nothing is signed
        run: |
          mkdir -p dist
          echo "0000  numb-form_test.tar.gz" > dist/SHA256SUMS
          PGP_SIGNING_KEY="" sh scripts/pgp-sign.sh dist
          test ! -e dist/SHA256SUMS.asc
      - name: With a key SHA256SUMS is signed and verified
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'numb-form CI test <ci@example.invalid>' ed25519 sign never
          gpg --batch --armor --export > .github/release-key.asc
          key=$(gpg --batch --pinentry-mode loopback --passphrase '' --armor --export-secret-keys)
          PGP_SIGNING_KEY="$key" sh scripts/pgp-sign.sh dist
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          rm dist/SHA256SUMS.asc .github/release-key.asc
          # A key without its published public key is refused.
          if PGP_SIGNING_KEY="$key" sh scripts/pgp-sign.sh dist; then echo "signed without .github/release-key.asc" >&2; exit 1; fi
          test ! -e dist/SHA256SUMS.asc
          rm -rf dist "$GNUPGHOME"

  release-notes:
    # The descriptions on the release pages (scripts/release-notes.sh).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stable and rolling notes are written
        run: |
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          sh scripts/release-notes.sh stable "$tag" | tee stable.md
          sh scripts/release-notes.sh edge HEAD | tee edge.md
          grep -q 'Verify the downloads' stable.md
          grep -q '^Rolling build of ' edge.md
          test "$(wc -l < stable.md)" -gt 2
          rm stable.md edge.md

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Zero third-party dependencies
        run: sh scripts/check-deps.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet (all platforms)
        run: |
          for os in linux windows darwin freebsd openbsd netbsd; do
            GOOS=$os go vet ./...
          done
      - name: go mod verify
        run: go mod verify
      - name: staticcheck
        # go install verifies the module against the Go checksum database.
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Cross-compile every release target
        if: github.event_name != 'pull_request'
        run: sh scripts/build-release.sh "ci-${GITHUB_SHA}" > /dev/null && rm -rf dist

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable]
        include:
          # Oldest supported Go (macOS refuses Go 1.21 binaries, so Linux).
          - { os: ubuntu-latest, go: "1.21.x" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false
      - name: Test
        shell: bash
        env:
          GO_VERSION: ${{ matrix.go }}
        run: |
          # The race detector runs where it is cheap: Linux, newest Go.
          race=
          [ "$RUNNER_OS" = Linux ] && [ "$GO_VERSION" = stable ] && race=-race
          set +e
          go test -count=1 $race ./... > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            grep -E -- '--- FAIL|panic:|FAIL\s|\.go:[0-9]+:' test.log | head -20 | while IFS= read -r l; do echo "::error title=go test::$l"; done
          fi
          exit $status

  bsd:
    needs: changes
    if: needs.changes.outputs.go == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: freebsd, version: "15.1" }
          - { os: openbsd, version: "7.9" }
          - { os: netbsd, version: "10.1" }
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start ${{ matrix.os }} VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          shell: sh
      - name: Install Go from the system's own packages
        shell: cpa.sh {0}
        run: |
          set -e
          case "$(uname -s)" in
          FreeBSD) sudo pkg install -y go ;;
          OpenBSD) sudo pkg_add -I go ;;
          NetBSD)
            if ! command -v pkgin >/dev/null 2>&1; then
              PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -m)/$(uname -r | cut -d_ -f1)/All"
              export PKG_PATH
              sudo -E pkg_add pkgin
            fi
            sudo pkgin -y install go ;;
          esac
      - name: Test
        shell: cpa.sh {0}
        run: |
          PATH=/usr/local/bin:/usr/pkg/bin:$PATH
          # pkgsrc (NetBSD) installs Go in versioned directories such as /usr/pkg/go126.
          for d in /usr/pkg/go1*/bin; do [ -x "$d/go" ] && PATH=$d:$PATH; done
          export PATH GOFLAGS=-mod=readonly CGO_ENABLED=0
          go version
          if ! go test -count=1 ./... > test.log 2>&1; then
            cat test.log
            grep -E -- '--- FAIL|panic:|\.go:[0-9]+:' test.log | head -20 | while IFS= read -r l; do echo "::error title=go test ($(uname -s))::$l"; done
            exit 1
          fi
          cat test.log
      - name: FreeBSD jail (container/jail.sh)
        if: matrix.os == 'freebsd'
        shell: cpa.sh {0}
        run: |
          set -e
          PATH=/usr/local/bin:$PATH
          export PATH GOFLAGS=-mod=readonly CGO_ENABLED=0
          repo=$(pwd)
          bin=$(mktemp -d)
          for c in numb-form numb-commit numb-date; do go build -o "$bin/$c" "./cmd/$c"; done
          work=$(mktemp -d)
          cd "$work"
          touch keep-me
          for c in numb-form numb-commit numb-date; do
            sudo NUMBFORM_BIN="$bin" NUMBFORM_DOWNLOADS="$work/downloads" sh "$repo/container/jail.sh" "$c" -version
          done
          # Must refuse to run without a terminal, as in the image.
          if sudo NUMBFORM_BIN="$bin" NUMBFORM_DOWNLOADS="$work/downloads" sh "$repo/container/jail.sh" numb-form < /dev/null; then
            echo "ran without a TTY" >&2; exit 1
          fi
          # The working folder is untouched, and nothing is left behind.
          test -f "$work/keep-me"
          if mount | grep numb-form-jail; then echo "mounts left behind" >&2; exit 1; fi
          if ls -d /tmp/numb-form-jail.* 2>/dev/null; then echo "jail folders left behind" >&2; exit 1; fi
          if jls | grep numbform; then echo "jail left running" >&2; exit 1; fi

  container:
    needs: changes
    if: needs.changes.outputs.go == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Build image (FROM scratch)
        run: ENGINE=docker container/build.sh numb-form:ci
      - name: Smoke test
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges numb-form:ci -version
          docker run --rm --read-only --cap-drop ALL --entrypoint /numb-commit numb-form:ci -version
          docker run --rm --read-only --cap-drop ALL --entrypoint /numb-date numb-form:ci -version
          # Must refuse to run without a terminal.
          if docker run --rm numb-form:ci; then echo "ran without a TTY" >&2; exit 1; fi
      - name: Podman smoke test
        run: |
          docker save numb-form:ci | podman load
          podman run --rm --read-only --cap-drop ALL numb-form:ci -version
