name: release approval

# Proposes a stable release and publishes it after the owner approves.
#
# When a pull request titled "vX.Y.Z: ..." is merged into main and ci
# passes on that commit, this workflow waits in the "release" environment
# for approval (GitHub mails a "Review pending deployments" link). After
# "Approve and deploy" it tags the tested commit vX.Y.Z (or the commit
# that adds only its translations, see below) and starts release.yml on
# that tag, which builds, signs and publishes exactly as a
# tag pushed by hand would. "Reject" (or no answer for 30 days) releases
# nothing. A tag created with the workflow token starts no workflow by
# itself, hence the explicit start. See .github/RELEASING.md.
#
# A milestone pull request may stand for several versions: the pull
# requests of the versions before it are closed unmerged with the label
# "milestone-part". The same approval then releases each of them first,
# oldest first, from its own commit, each with its own release page,
# and the milestone last.

on:
  # Only runs of ci on main started by a push (a merge) count, and nothing
  # of the triggering run is checked out or executed: only its commit SHA
  # is used, as the commit to tag.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from the newest main, such as v1.4.1"
        required: true

permissions: {}

concurrency:
  group: release-approval-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read # the translate run of the merge
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      parts: ${{ steps.v.outputs.parts }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ]; then
            sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
            version=$INPUT
            from="started by hand"
          else
            sha=$RUN_SHA
            # The pull request that was merged into main with this commit.
            title=$(gh api "repos/$REPO/commits/$sha/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].title // ""')
            version=$(printf '%s\n' "$title" | sed -nE '1s/^(v[0-9]+\.[0-9]+\.[0-9]+):.*/\1/p')
            from="pull request: $title"
            if [ -z "$version" ]; then
              echo "No release: the merged pull request is not titled vX.Y.Z: ($title)."
              exit 0
            fi
          fi
          if ! printf '%s\n' "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$version is not a version like v1.4.1"
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/$version" > /dev/null 2>&1; then
            echo "$version is already tagged; nothing to release."
            exit 0
          fi
          newest=$(gh api "repos/$REPO/tags?per_page=100" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::error::$version is not newer than the newest release $newest"
            exit 1
          fi
          # Without a required reviewer the next job would run at once:
          # refuse rather than release without asking.
          rules=$(gh api "repos/$REPO/environments/release" --jq '[.protection_rules[]?.type] | join(" ")' 2>/dev/null || true)
          case " $rules " in
          *" required_reviewers "*) ;;
          *)
            echo "::error::the release environment has no required reviewer, so $version would be released without asking. Set it up as described in .github/RELEASING.md, then re-run this workflow."
            exit 1
            ;;
          esac
          # The programs embed docs/es and docs/de, which the translate run
          # of the merge commits a few minutes after it. Wait for that run
          # (at most 40 minutes) and tag its commit instead, but only when
          # it follows the tested commit directly and changes nothing but
          # the translations; otherwise tag the tested commit.
          if ! printf '%s\n' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::$sha is not a commit ID"
            exit 1
          fi
          translations="none for this commit"
          for _ in $(seq 80); do
            run=$(gh api "repos/$REPO/actions/workflows/translate.yml/runs?head_sha=$sha&event=push" \
              --jq '.workflow_runs[0] // {} | "\(.status // "") \(.conclusion // "")"')
            case $run in
            "completed "*|" ") break ;;
            esac
            sleep 30
          done
          case $run in
          "completed success")
            translations="no commit that only adds translations follows it; the tested commit is tagged"
            # The bot's commit whose only parent is the tested one (the
            # compare lists commits by date, and a branch may start there
            # too).
            next_sha=$(gh api "repos/$REPO/compare/$sha...main" \
              --jq "[.commits[] | select((.parents | length) == 1 and .parents[0].sha == \"$sha\" and .author.login == \"github-actions[bot]\")][0].sha // \"\"")
            if [ -n "$next_sha" ]; then
              subject=$(gh api "repos/$REPO/commits/$next_sha" --jq '.commit.message | split("\n")[0]')
              other=$(gh api "repos/$REPO/commits/$next_sha" --jq '.files[].filename' |
                grep -cvE '^(docs/es/|docs/de/|\.github/translate/models\.sha256$)' || true)
              if [ "$subject" = "docs: update Spanish and German translations (Argos Translate)" ] && [ "$other" = 0 ]; then
                translations="commit $next_sha (the tested commit plus its translations) is tagged"
                sha=$next_sha
              fi
            fi
            ;;
          " ") ;;
          *) translations="the translate run was \"$run\"; the tested commit is tagged" ;;
          esac
          # The versions this milestone stands for: closed, unmerged pull
          # requests labelled milestone-part, newer than the newest release
          # and older than this version, whose commit is part of the
          # commit to release. Oldest first, one commit per version.
          parts=""
          if [ "$EVENT" != workflow_dispatch ]; then
            list=$(gh pr list --repo "$REPO" --state closed --label milestone-part --limit 200 \
              --json title,headRefOid,mergedAt --jq '.[] | select(.mergedAt == null) | "\(.headRefOid) \(.title)"' || true)
            found=$(printf '%s\n' "$list" | while read -r head title; do
              v=$(printf '%s\n' "$title" | sed -nE '1s/^(v[0-9]+\.[0-9]+\.[0-9]+):.*/\1/p')
              [ -n "$v" ] || continue
              printf '%s\n' "$head" | grep -qE '^[0-9a-f]{40}$' || continue
              [ "$v" != "$version" ] || continue
              [ "$(printf '%s\n%s\n' "$v" "$version" | sort -V | tail -n 1)" = "$version" ] || continue
              if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$v" | sort -V | tail -n 1)" != "$v" ]; then continue; fi
              [ "$v" != "$newest" ] || continue
              gh api "repos/$REPO/git/ref/tags/$v" > /dev/null 2>&1 && continue
              status=$(gh api "repos/$REPO/compare/$head...$sha" --jq .status 2>/dev/null || true)
              case $status in ahead|identical) printf '%s:%s\n' "$v" "$head" ;; esac
            done | sort -t: -k1,1V -u)
            parts=$(printf '%s\n' "$found" | sed '/^$/d' | tr '\n' ' ' | sed 's/ $//')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          {
            echo "### $version is waiting for your approval"
            echo
            echo "- commit: \`$sha\`"
            echo "- $from"
            echo "- translations: $translations"
            echo "- newest release so far: ${newest:-none}"
            if [ -n "$parts" ]; then
              echo "- released first, oldest first, each from its own commit:"
              for p in $parts; do echo "  - ${p%%:*} (\`${p#*:}\`)"; done
            fi
            echo
            echo "Approve the **release** deployment to tag and publish it, or reject it to release nothing."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: propose
    if: needs.propose.outputs.version != ''
    runs-on: ubuntu-latest
    # The owner approves here (required reviewer of the environment).
    environment: release
    permissions:
      contents: write # create the tags, write the release pages
      actions: write  # start release.yml, which a tag made here does not start
    steps:
      # main, for scripts/release-notes.sh and CHANGES.md; nothing of the
      # releases themselves is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.propose.outputs.version }}
          SHA: ${{ needs.propose.outputs.sha }}
          PARTS: ${{ needs.propose.outputs.parts }}
        run: |
          set -eu
          # One version at a time, oldest first, so that the newest release
          # and the image's "latest" end at the milestone. A failed build
          # stops here: nothing newer is released.
          for item in $PARTS "$VERSION:$SHA"; do
            v=${item%%:*}
            c=${item#*:}
            gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$v" -f "sha=$c" > /dev/null
            gh workflow run release.yml --repo "$REPO" --ref "$v"
            id=""
            for _ in $(seq 60); do
              id=$(gh run list --repo "$REPO" --workflow release.yml --branch "$v" --json databaseId --jq '.[0].databaseId // ""')
              [ -n "$id" ] && break
              sleep 10
            done
            if [ -z "$id" ]; then
              echo "::error::the release build of $v did not start"
              exit 1
            fi
            if ! gh run watch "$id" --repo "$REPO" --exit-status --interval 30 > /dev/null; then
              echo "::error::the release build of $v failed (run $id); nothing newer was released"
              exit 1
            fi
            git fetch -q --tags origin
            REPO="$REPO" sh scripts/release-notes.sh stable "$v" > "$RUNNER_TEMP/notes.md"
            gh release edit "$v" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Released $v from $c." >> "$GITHUB_STEP_SUMMARY"
          done
