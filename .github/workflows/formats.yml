name: formats

# Real-world format tests: templates and spreadsheets written by
# LibreOffice (.odt, .fodt, .rtf, .docx, legacy .doc and .xls, .ods,
# .fods) are filled and read by numb-form. Runs once per pull request
# change (not again for the push of the same commit), on main and
# nightly.
#
# The job runs in Debian 13 and installs LibreOffice from deb.debian.org,
# which a CDN serves quickly. Ubuntu's mirror for GitHub's runners
# sometimes served the ~105 MB of packages at 25 kB/s (42 minutes).
# apt verifies every package against the signed archive index.

on:
  push:
    branches: [main]
    paths:
      - "internal/**"
      - go.mod
      - .github/workflows/formats.yml
  pull_request:
    paths:
      - "internal/**"
      - go.mod
      - .github/workflows/formats.yml
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: formats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install LibreOffice (Debian packages)
        run: |
          apt="apt-get -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          $apt update
          DEBIAN_FRONTEND=noninteractive $apt install -y --no-install-recommends ca-certificates libreoffice-writer-nogui libreoffice-calc-nogui
          soffice --version
      - name: Format tests with LibreOffice
        env:
          NUMBFORM_TEST_SOFFICE: "1"
          CGO_ENABLED: "0"
        run: |
          set +e
          go test -count=1 -v ./internal/formats/ > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            grep -E -- '--- FAIL|panic:|\.go:[0-9]+:' test.log | head -30 | while IFS= read -r l; do echo "::error title=formats::$l"; done
          fi
          exit $status
