name: formats

# Real-world format tests: templates and spreadsheets written by
# LibreOffice (.odt, .fodt, .rtf, .docx, legacy .doc and .xls, .ods,
# .fods) are filled and read by numb-form. Runs once per pull request
# change (not again for the push of the same commit), on main and
# nightly.
#
# The job runs in Alpine Linux 3.24 and installs LibreOffice from
# dl-cdn.alpinelinux.org, which a CDN serves quickly; the image is a few
# MB and apk installs without post-install scripts. Ubuntu's mirror for
# GitHub's runners sometimes served the ~105 MB of packages at 25 kB/s
# (42 minutes). apk verifies every package against the signed index.

on:
  push:
    branches: [main]
    paths:
      - "internal/**"
      - go.mod
      - .github/workflows/formats.yml
  pull_request:
    paths:
      - "internal/**"
      - go.mod
      - .github/workflows/formats.yml
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: formats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install LibreOffice (Alpine packages)
        # One font, so that LibreOffice has something to lay text out with.
        run: |
          apk add --no-cache libreoffice-writer libreoffice-calc font-dejavu
          soffice --version
      - name: Format tests with LibreOffice
        env:
          NUMBFORM_TEST_SOFFICE: "1"
          CGO_ENABLED: "0"
        run: |
          set +e
          go test -count=1 -v ./internal/formats/ > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            grep -E -- '--- FAIL|panic:|\.go:[0-9]+:' test.log | head -30 | while IFS= read -r l; do echo "::error title=formats::$l"; done
          fi
          exit $status
