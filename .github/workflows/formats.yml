name: formats

# Real-world format tests: templates and spreadsheets written by
# LibreOffice (.odt, .fodt, .rtf, .docx, legacy .doc and .xls, .ods,
# .fods) are filled and read by numb-form. Runs once per pull request
# change (not again for the push of the same commit), on main and
# nightly.
#
# The Ubuntu mirror sometimes serves the ~105 MB of LibreOffice packages
# at 25 kB/s (42 minutes). The packages are cached between runs; apt
# still checks every cached file against the signed package index.

on:
  push:
    branches: [main]
    paths:
      - "internal/**"
      - go.mod
      - .github/workflows/formats.yml
  pull_request:
    paths:
      - "internal/**"
      - go.mod
      - .github/workflows/formats.yml
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: formats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Runner image version
        id: image
        # ImageVersion changes when GitHub updates the runner image; an
        # older cache still saves every package that did not change.
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the LibreOffice packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-archives
          key: libreoffice-debs-${{ runner.os }}-${{ steps.image.outputs.version }}
          restore-keys: libreoffice-debs-${{ runner.os }}-
      - name: Install LibreOffice (Ubuntu packages)
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          apt="sudo apt-get -q -o Dir::Cache::Archives=$HOME/apt-archives -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui \
            || $apt install -y --no-install-recommends libreoffice-writer libreoffice-calc
          # Keep only the packages; let the cache step read them.
          sudo rm -rf "$HOME/apt-archives/partial" "$HOME/apt-archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          soffice --version
      - name: Format tests with LibreOffice
        env:
          NUMBFORM_TEST_SOFFICE: "1"
        run: |
          set +e
          go test -count=1 -v ./internal/formats/ > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            grep -E -- '--- FAIL|panic:|\.go:[0-9]+:' test.log | head -30 | while IFS= read -r l; do echo "::error title=formats::$l"; done
          fi
          exit $status
