name: release

on:
  push:
    tags: ["v*"]
  # Started on a tag by release-approval.yml (and by updates.yml for a
  # rebuild with a newer Go): a tag made with the workflow token does not
  # start the push trigger above.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only ever on a version tag, also when started by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # keyless Sigstore signing and attestations
      attestations: write  # build provenance
      packages: write      # push the image to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Check, test and vulnerability scan
        run: |
          sh scripts/check-deps.sh
          go test -count=1 -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: sh scripts/build-release.sh "$VERSION"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums (Sigstore keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Build provenance for archives and binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/bin/*/numb-form
            dist/bin/*/numb-commit
            dist/bin/*/numb-date
            dist/bin/*/numb-typo
            dist/bin/*/numb-form.exe
            dist/bin/*/numb-commit.exe
            dist/bin/*/numb-date.exe
            dist/bin/*/numb-typo.exe
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          # A release created in the GitHub web page (which also creates the
          # tag) already exists: add the files to it instead.
          files="dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256 dist/SHA256SUMS.sigstore.json"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$VERSION" --clobber $files
          else
            # shellcheck disable=SC2086
            gh release create "$VERSION" --verify-tag --title "$VERSION" \
              --notes "Verify downloads as described in docs/install.md (SHA256SUMS, Sigstore bundle, build provenance)." $files
          fi
      - name: Build and push image (FROM scratch, amd64 + arm64)
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          cp /etc/ssl/certs/ca-certificates.crt dist/
          cp container/Dockerfile.release dist/Dockerfile
          for arch in amd64 arm64; do
            docker build --platform "linux/$arch" --build-arg "TARGETARCH=$arch" -t "$IMAGE:$VERSION-$arch" dist
            docker push "$IMAGE:$VERSION-$arch"
          done
          docker manifest create "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          digest=$(docker manifest push --purge "$IMAGE:$VERSION")
          docker manifest create "$IMAGE:latest" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker manifest push --purge "$IMAGE:latest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io
      - name: Sign image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign sign --yes "$IMAGE@$DIGEST"
      - name: Image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Remove build output
        if: always()
        run: rm -rf dist
