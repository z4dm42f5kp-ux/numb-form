name: edge

# Development build: after every push to main, rebuild the binaries and
# publish them anew as the "edge" pre-release, so that the reinstall
# command in docs/install.md can fetch the newest code without a stable
# release being published. "releases/latest" keeps pointing at the newest
# stable release; edge is never marked latest.

# It always builds the newest commit of main, so the rolling build is never
# behind a stable release: publishing a release rebuilds it too, and the
# translate workflow starts it after committing translations (pushes made
# with the workflow token start no other workflow).
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: edge
  cancel-in-progress: false

jobs:
  edge:
    if: github.event_name != 'release' || github.event.release.tag_name != 'edge'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # update the edge pre-release and move its tag
      id-token: write      # keyless Sigstore signing and attestations
      attestations: write  # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Rolling must contain the newest stable release
        run: |
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$tag" ] && ! git merge-base --is-ancestor "$tag" HEAD; then
            echo "::error::stable release $tag is not part of main; rolling would be behind it. Merge it into main."
            exit 1
          fi
          echo "main contains ${tag:-no stable release yet}"
      - name: Check, test and vulnerability scan
        run: |
          sh scripts/check-deps.sh
          go test -count=1 -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build archives
        id: build
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          sh scripts/build-release.sh "rolling-$(printf '%.7s' "$SHA")"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums (Sigstore keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Build provenance for archives and binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/ai-prompt.txt
            dist/bin/*/numb-form
            dist/bin/*/numb-commit
            dist/bin/*/numb-date
            dist/bin/*/numb-typo
            dist/bin/*/numb-form.exe
            dist/bin/*/numb-commit.exe
            dist/bin/*/numb-date.exe
            dist/bin/*/numb-typo.exe
      - name: Update the edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          notes="Rolling build of commit $SHA, rebuilt after every change to main (numb-form update rolling). Not a stable release. Verify downloads as described in docs/install.md."
          # A release keeps its first publication date when it is edited,
          # and the releases page sorts by it: publish it anew each time,
          # so rolling stands next to the newest stable release. The tag
          # stays and moves to this commit; gh uploads the files to a
          # draft and publishes it whole, so no download sees half a
          # release. Between the delete and the publication (about a
          # minute) there is no rolling release; an update then fails
          # with "not found" and works when tried again.
          if gh api "repos/$REPO/git/ref/tags/edge" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$REPO/git/refs/tags/edge" -f sha="$SHA" -F force=true > /dev/null
          fi
          if gh release view edge --repo "$REPO" > /dev/null 2>&1; then
            gh release delete edge --repo "$REPO" --yes
          fi
          gh release create edge --repo "$REPO" --target "$SHA" --prerelease --latest=false \
            --title "rolling (newest build of main)" --notes "$notes" \
            dist/*.tar.gz dist/*.zip dist/ai-prompt.txt dist/SHA256SUMS dist/SHA256 dist/SHA256SUMS.sigstore.json
      - name: Remove build output
        if: always()
        run: rm -rf dist
