# Keeps the commit-SHA pins of actions and the hash-locked Python tools
# up to date, checked every day. Every update arrives as a pull request
# and runs the full security pipeline before it can be merged. Only
# stable versions are proposed, and only after 14 days (the cooldown);
# security updates come at once. Go itself and the Go tools pinned in the
# workflows are checked by .github/workflows/updates.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 14
  # Only Argos Translate itself: its dependencies must fit together, so
  # the lock is regenerated as a whole with the uv command at the top of
  # requirements.txt. Single-package bumps (torch, stanza, thinc) broke
  # the translations. An advisory for another package arrives as an
  # alert, and its Dependabot job fails with "all versions ignored": raise
  # the version in overrides.txt and regenerate the lock instead.
  - package-ecosystem: pip
    directory: /.github/translate
    schedule:
      interval: daily
    cooldown:
      default-days: 14
    allow:
      - dependency-name: argostranslate
