# Keeps the commit-SHA pins of actions and the hash-locked Python tools
# up to date. Every update arrives as a pull request and runs the full
# security pipeline before it can be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # Only Argos Translate itself: its dependencies must fit together, so
  # the lock is regenerated as a whole with the uv command at the top of
  # requirements.txt. Single-package bumps (torch, stanza, thinc) broke
  # the translations. Security updates still arrive for every package.
  - package-ecosystem: pip
    directory: /.github/translate
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    allow:
      - dependency-name: argostranslate
