# Security updates only: a pull request opens when an action or a Python
# tool has a published vulnerability, at once. Routine version bumps open
# none (open-pull-requests-limit: 0), so they never cut across planned
# release pull requests; raise the limit to get them back. Every update
# runs the full security pipeline; the dependabot workflow merges it once
# every check has passed and passes the update on to every open pull
# request. Go itself and the Go tools pinned in the workflows are checked
# by .github/workflows/updates.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    cooldown:
      default-days: 14
    # One pull request for all actions, so parts of one action (such as
    # codeql-action init and analyze) always move together.
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  # Only Argos Translate itself: its dependencies must fit together, so
  # the lock is regenerated as a whole with the uv command at the top of
  # requirements.txt. Single-package bumps (torch, stanza, thinc) broke
  # the translations. An advisory for another package arrives as an
  # alert, and its Dependabot job fails with "all versions ignored": raise
  # the version in overrides.txt and regenerate the lock instead.
  - package-ecosystem: pip
    directory: /.github/translate
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    cooldown:
      default-days: 14
    allow:
      - dependency-name: argostranslate
