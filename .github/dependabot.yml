# Every update, without approval: a security update opens at once, a
# routine version update once the version is 14 days old. All actions
# move in one grouped pull request. Every update runs the full security
# pipeline; the dependabot workflow merges it into main once every check
# has passed and passes the update on to every open pull request, so it
# never cuts across a planned release. Go itself and the Go tools pinned
# in the workflows are checked by .github/workflows/updates.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    # One pull request for all actions, so parts of one action (such as
    # codeql-action init and analyze) always move together.
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  # Only Argos Translate itself: its dependencies must fit together, so
  # the lock is regenerated as a whole with the uv command at the top of
  # requirements.txt. Single-package bumps (torch, stanza, thinc) broke
  # the translations. An advisory for another package arrives as an
  # alert, and its Dependabot job fails with "all versions ignored": raise
  # the version in overrides.txt and regenerate the lock instead.
  - package-ecosystem: pip
    directory: /.github/translate
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    allow:
      - dependency-name: argostranslate
