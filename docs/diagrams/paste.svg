<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
<title>Pasting a command into a terminal</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs>
<rect width="840" height="640" fill="#ffffff"/>
<text x="20" y="34" font-size="22" font-weight="bold" fill="#212529">Pasting a command into a terminal</text>
<line x1="380" y1="112.0" x2="440" y2="112.0" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<line x1="380" y1="252.0" x2="440" y2="112.0" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<line x1="380" y1="352.0" x2="440" y2="382.0" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<line x1="380" y1="442.0" x2="440" y2="382.0" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="60" width="360" height="104" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="32" y="87" font-weight="bold" fill="#212529" xml:space="preserve">Windows PowerShell (blue window)</text>
<text x="32" y="107" fill="#212529" xml:space="preserve">or Command Prompt (black window):</text>
<text x="32" y="127" fill="#212529" xml:space="preserve">RIGHT-CLICK pastes at once.</text>
<text x="32" y="147" fill="#212529" xml:space="preserve">Ctrl+V also works on Windows 10, 11.</text>
<rect x="440" y="60" width="360" height="104" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="452" y="87" font-weight="bold" fill="#212529" xml:space="preserve">The whole line appears.</text>
<text x="452" y="107" fill="#212529" xml:space="preserve">Nothing runs until you press Enter.</text>
<text x="452" y="127" fill="#212529" xml:space="preserve">A red message: read it, do not retry</text>
<text x="452" y="147" fill="#212529" xml:space="preserve">blindly.</text>
<rect x="20" y="210" width="360" height="84" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="32" y="237" font-weight="bold" fill="#212529" xml:space="preserve">Windows Terminal (tabs at the top):</text>
<text x="32" y="257" fill="#212529" xml:space="preserve">Ctrl+V pastes. Right-click may open</text>
<text x="32" y="277" fill="#212529" xml:space="preserve">a menu or paste, depending on settings.</text>
<rect x="20" y="330" width="360" height="44" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="32" y="357" font-weight="bold" fill="#212529" xml:space="preserve">macOS Terminal: Cmd+V pastes.</text>
<rect x="20" y="410" width="360" height="64" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="32" y="437" font-weight="bold" fill="#212529" xml:space="preserve">Linux terminals: Ctrl+Shift+V pastes.</text>
<text x="32" y="457" fill="#212529" xml:space="preserve">Ctrl+V alone does not paste.</text>
<rect x="440" y="330" width="360" height="104" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="452" y="357" font-weight="bold" fill="#212529" xml:space="preserve">Press Enter once.</text>
<text x="452" y="377" fill="#212529" xml:space="preserve">Wait until the prompt comes back:</text>
<text x="452" y="397" font-family="Consolas, Menlo, monospace" font-size="14" fill="#212529" xml:space="preserve">  PS C:\Users\you&gt;   (PowerShell)</text>
<text x="452" y="417" font-family="Consolas, Menlo, monospace" font-size="14" fill="#212529" xml:space="preserve">  you@host ~ %      (macOS)</text>
<rect x="20" y="518" width="14" height="14" fill="#a5d8ff" stroke="#1971c2"/>
<text x="42" y="530" font-size="13" fill="#212529">You do this</text>
<rect x="20" y="538" width="14" height="14" fill="#e9ecef" stroke="#495057"/>
<text x="42" y="550" font-size="13" fill="#212529">numb-form does this</text>
<rect x="20" y="558" width="14" height="14" fill="#ffec99" stroke="#f08c00"/>
<text x="42" y="570" font-size="13" fill="#212529">numb-form asks, you answer</text>
<rect x="20" y="578" width="14" height="14" fill="#b2f2bb" stroke="#2f9e44"/>
<text x="42" y="590" font-size="13" fill="#212529">Check that you see this</text>
<rect x="20" y="598" width="14" height="14" fill="#ffc9c9" stroke="#e03131"/>
<text x="42" y="610" font-size="13" fill="#212529">Stop and get help</text>
</svg>
